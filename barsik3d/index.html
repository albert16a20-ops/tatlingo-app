<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Барсик 3D</title>
<!-- 3D-Барсик в «мультфильмовом» стиле (мягкий свет, тени, настоящие 3D-глаза).
     В приложении управляется через window.Barsik, касания уходят в window.Android. -->
<style>
  html, body { margin:0; height:100%; overflow:hidden; font:15px/1.4 system-ui, sans-serif; color:#2f2a36; }
  body.preview { background:
      radial-gradient(60px 26px at 18% 16%, #fff 70%, transparent 72%),
      radial-gradient(44px 22px at 24% 13%, #fff 70%, transparent 72%),
      radial-gradient(70px 28px at 82% 22%, #fff 70%, transparent 72%),
      radial-gradient(48px 22px at 76% 19%, #fff 70%, transparent 72%),
      linear-gradient(#8fcbff, #d8efff 55%, #eef6e8); }
  body:not(.preview) { background:transparent; }
  #stage { position:absolute; inset:0; touch-action:none; }
  body.preview #stage { bottom:110px; }
  #stage canvas { display:block; width:100%; height:100%; opacity:0; transform:scale(.92) translateY(14px); transition:opacity .6s ease-out, transform .7s cubic-bezier(.2,1.4,.4,1); }
  #stage canvas.shown { opacity:1; transform:none; }
  .bar { position:absolute; left:0; right:0; bottom:0; display:flex; flex-wrap:wrap; gap:8px; padding:10px 12px 14px; justify-content:center; }
  .bar button { border:0; border-radius:999px; padding:8px 13px; font:600 14px system-ui; background:#fff; color:#2f2a36; box-shadow:0 1px 3px #0002; }
  .fx { position:absolute; pointer-events:none; font-size:30px; animation:up 1.3s ease-out forwards; }
  @keyframes up { from { transform:translateY(0) scale(.7); opacity:1 } to { transform:translateY(-140px) scale(1.3); opacity:0 } }
</style>
</head>
<body>
<div id="stage"></div>
<script>try{if(window.parent!==window&&window.parent.Barsik3DBridge)window.Android=window.parent.Barsik3DBridge;}catch(e){}</script>
<script src="three.min.js"></script>
<script>
(() => {
const native = window.Android;
window.onerror = (msg, src, line) => { native && native.onLog(`${msg} @${line}`); };
if (!window.THREE || !document.createElement('canvas').getContext('webgl')) { native && native.onFail(); return; }
if (!native) document.body.classList.add('preview');

// ================= Палитра =================
const P = {
  // Окрас как у настоящего снежного барса: дымчато-серый с тёплым бежевым оттенком сверху,
  // белая мордочка и грудка, тёмные розетки с бежевой серединкой, нос пыльно-розовый.
  fur:0xe9e5dc, furWarm:0xfbf8f2, spot:0x34373c, spotSoft:0x7d838c, rosetteMid:0xcbbfa8, pink:0xe9b4b0, nose:0xc98a8e, pad:0x5c5a62,
  green:0x0f9a52, greenDark:0x0b6e3c, gold:0xe8b84a, shirt:0xfbfbf8, pants:0x26282e, mouth:0x5a1f2a, tongue:0xf08a9a,
};
const CAPS = ['#1aa260', '#c2412d', '#2c6bc9', '#d4a020'];
const lin = hex => new THREE.Color(hex).convertSRGBToLinear();

// ================= Сцена =================
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 50);
camera.position.set(0, 1.25, 5.0);
camera.lookAt(0, 1.0, 0);

// Свет как в мультфильме: тёплый ключевой, голубое небо, холодный контровой
scene.add(new THREE.HemisphereLight(lin(0xdcefff), lin(0xf3e3cf), 0.6));
const key = new THREE.DirectionalLight(lin(0xfff1e0), 1.45);
key.position.set(-2.2, 4.2, 3.4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -1.6, right: 1.6, top: 2.6, bottom: -0.6, near: 1, far: 12 });
key.shadow.bias = -0.0006;
key.shadow.radius = 4;
scene.add(key);
const rimL = new THREE.DirectionalLight(lin(0xcfe6ff), 0.9);
rimL.position.set(2.8, 2.6, -3);
scene.add(rimL);
const fill = new THREE.DirectionalLight(lin(0xffffff), 0.35);
fill.position.set(2.5, 1.2, 3);
scene.add(fill);
// Тёплый отражённый свет снизу — от светлого постамента; смягчает тени под подбородком
const bounce = new THREE.DirectionalLight(lin(0xffe7c2), 0.28);
bounce.position.set(0, -2, 2.5);
scene.add(bounce);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.position.z = 5.0 * Math.max(1, 0.85 / camera.aspect);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

// ================= Материалы и текстуры =================
const canvasTex = (w, h, draw, srgb = true) => {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  if (srgb) t.encoding = THREE.sRGBEncoding;
  return t;
};
// Мягкая «шерсть»: короткие штрихи, слегка размытые — плюшевый рельеф без «наждачки»
const furBump = canvasTex(512, 512, (x, w, h) => {
  x.fillStyle = '#808080'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 7000; i++) {
    const px = Math.random() * w, py = Math.random() * h, a = Math.PI / 2 + (Math.random() - 0.5) * 0.5, l = 3 + Math.random() * 5;
    const v = 112 + Math.random() * 70 | 0;
    x.strokeStyle = `rgb(${v},${v},${v})`; x.lineWidth = 1.4;
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke();
  }
  // Размываем ОДИН раз готовую картинку. Фильтр на каждом штрихе стоил ~1.4 с на ПК и
  // на телефоне не укладывался в таймаут приложения — 3D не появлялся.
  const copy = document.createElement('canvas');
  copy.width = w; copy.height = h;
  copy.getContext('2d').drawImage(x.canvas, 0, 0);
  x.filter = 'blur(0.7px)';
  x.drawImage(copy, 0, 0);
  x.filter = 'none';
}, false);
furBump.wrapS = furBump.wrapT = THREE.RepeatWrapping;
furBump.repeat.set(4, 4);
const fabricBump = canvasTex(256, 256, (x, w, h) => {
  x.fillStyle = '#808080'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < w; i += 3) { x.fillStyle = i % 6 ? '#8a8a8a' : '#767676'; x.fillRect(i, 0, 1, h); x.fillRect(0, i, w, 1); }
}, false);
fabricBump.wrapS = fabricBump.wrapT = THREE.RepeatWrapping;
fabricBump.repeat.set(6, 6);

const std = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: lin(color), roughness: 0.8, metalness: 0 }, o));
// Плюшевый мех: по краям силуэта мягкое голубоватое свечение (как ворс на просвет),
// а в глубине чуть тёплый оттенок — белый мех перестаёт выглядеть пластиком.
function plush(m, rim = 0xdfeeff, strength = 0.42) {
  m.onBeforeCompile = sh => {
    sh.uniforms.rimColor = { value: lin(rim).multiplyScalar(strength) };
    sh.fragmentShader = 'uniform vec3 rimColor;\n' + sh.fragmentShader.replace('#include <emissivemap_fragment>',
      `#include <emissivemap_fragment>
       float facing = abs(dot(normal, normalize(vViewPosition)));
       totalEmissiveRadiance += rimColor * pow(1.0 - facing, 2.2);`);
  };
  return m;
}
// Неровный окрас меха: мягкие светлые и дымчатые пятна, чтобы шерсть не была «ровной пластмассой».
// Несколько сотен прямоугольников — генерируется за миллисекунды.
const furTone = canvasTex(256, 256, (x, w, h) => {
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++) {
    const r = 10 + Math.random() * 28, v = 228 + Math.random() * 27 | 0;
    x.fillStyle = `rgba(${v},${v - 4},${v - 10},0.35)`;
    x.beginPath(); x.arc(Math.random() * w, Math.random() * h, r, 0, 7); x.fill();
  }
});
furTone.wrapS = furTone.wrapT = THREE.RepeatWrapping;
furTone.repeat.set(2, 2);
const furMat = (color = P.fur, o = {}) => plush(std(color, Object.assign({ roughness: 0.95, map: furTone, bumpMap: furBump, bumpScale: 0.005 }, o)));
const cloth = (color, o = {}) => std(color, Object.assign({ roughness: 0.75, bumpMap: fabricBump, bumpScale: 0.004 }, o));
const goldMat = () => std(P.gold, { roughness: 0.32, metalness: 0.75 });

function mesh(geo, material, parent, o = {}) {
  const m = new THREE.Mesh(geo, material);
  if (o.pos) m.position.set(...o.pos);
  if (o.rot) m.rotation.set(...o.rot);
  if (o.scale) m.scale.set(...o.scale);
  m.castShadow = o.shadow !== false;
  m.receiveShadow = true;
  m.userData.part = o.part;
  parent.add(m);
  return m;
}
const group = (parent, pos = [0, 0, 0]) => { const g = new THREE.Group(); g.position.set(...pos); parent.add(g); return g; };

// ================= Постамент =================
const PED_H = 0.2;
const pedBand = canvasTex(2048, 128, (x, w, h) => {
  const grd = x.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0, '#1fae68'); grd.addColorStop(1, '#0d6e3f');
  x.fillStyle = grd; x.fillRect(0, 0, w, h);
  x.fillStyle = '#e8b84a'; x.fillRect(0, 0, w, 9); x.fillRect(0, h - 9, w, 9);
  x.strokeStyle = '#e8b84a'; x.lineWidth = 5; x.lineCap = 'round';
  for (let i = 0; i < 24; i++) {
    const cx = (i + 0.5) * w / 24, cy = h / 2;
    x.beginPath(); x.moveTo(cx - 36, cy + 14); x.bezierCurveTo(cx - 30, cy - 30, cx - 4, cy - 26, cx, cy);
    x.bezierCurveTo(cx + 4, cy + 26, cx + 30, cy + 30, cx + 36, cy - 14); x.stroke();
    x.fillStyle = '#9fe8cf'; x.beginPath(); x.arc(cx, cy, 6, 0, 7); x.fill();
  }
});
const pedTop = canvasTex(512, 512, (x, w) => {
  const r = w / 2;
  x.fillStyle = '#f4efe4'; x.fillRect(0, 0, w, w);
  x.strokeStyle = '#e8b84a'; x.lineWidth = 8; x.beginPath(); x.arc(r, r, r * 0.92, 0, 7); x.stroke();
  x.lineWidth = 3; x.beginPath(); x.arc(r, r, r * 0.82, 0, 7); x.stroke();
  x.fillStyle = '#1aa260';
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2;
    x.save(); x.translate(r + Math.cos(a) * r * 0.87, r + Math.sin(a) * r * 0.87); x.rotate(a + Math.PI / 2);
    x.beginPath(); x.moveTo(0, -9); x.quadraticCurveTo(8, 0, 0, 9); x.quadraticCurveTo(-8, 0, 0, -9); x.fill();
    x.restore();
  }
});
const pedestal = mesh(new THREE.CylinderGeometry(1.08, 1.13, PED_H, 96),
  [std(0xffffff, { map: pedBand, roughness: 0.6 }), std(0xffffff, { map: pedTop, roughness: 0.45 }), std(0xe6dccb)], scene,
  { pos: [0, -PED_H / 2, 0] });
[[1.085, 0.0], [1.13, -PED_H]].forEach(([r, y]) => mesh(new THREE.TorusGeometry(r, 0.02, 12, 96), goldMat(), scene, { pos: [0, y, 0], rot: [Math.PI / 2, 0, 0] }));
mesh(new THREE.CylinderGeometry(1.2, 1.25, 0.08, 96), std(0xe6dccb, { roughness: 0.5 }), scene, { pos: [0, -PED_H - 0.04, 0] });

// ================= Барсик =================
const root = group(scene);
const body = group(root);

// Костюм перекрашивается вместе с тюбетейкой: все цветные детали (камзол, манжеты, ворот, пояс, кушак)
// собраны в общие материалы. Для золотой тюбетейки камзол чуть темнее — иначе золотая тесьма на нём теряется.
const SUITS = ['#1aa260', '#b23a28', '#2a62b8', '#c08414'];
const suitMats = [];
const suitCloth = () => { const m = cloth(SUITS[0]); suitMats.push(m); return m; };

// ---- Ноги ----
[-1, 1].forEach(sd => {
  const leg = group(body, [sd * 0.13, 0, 0]);
  const pantsProf = [[0.0, 0.16], [0.135, 0.17], [0.125, 0.3], [0.118, 0.47], [0, 0.48]].map(([r, y]) => new THREE.Vector2(r, y));
  mesh(new THREE.LatheGeometry(pantsProf, 32), cloth(P.pants), leg, {});
  mesh(new THREE.TorusGeometry(0.13, 0.024, 12, 32), suitCloth(), leg, { pos: [0, 0.17, 0], rot: [Math.PI / 2, 0, 0] });
  mesh(new THREE.TorusGeometry(0.133, 0.006, 6, 32), goldMat(), leg, { pos: [0, 0.195, 0], rot: [Math.PI / 2, 0, 0] });
  // Пушистая лапа с «пальчиками»
  const foot = group(leg, [sd * 0.01, 0.075, 0.07]);
  mesh(new THREE.SphereGeometry(0.13, 32, 20), furMat(), foot, { scale: [1, 0.6, 1.3], part: 'feet' });
  [-0.055, 0, 0.055].forEach(dx => mesh(new THREE.SphereGeometry(0.045, 16, 12), furMat(), foot, { pos: [dx, -0.01, 0.13], scale: [1, 0.85, 1] }));
});

// ---- Туловище ----
const torso = group(body, [0, 0.45, 0]);
const prof = [[0, -0.05], [0.25, -0.04], [0.29, 0.05], [0.31, 0.2], [0.29, 0.36], [0.24, 0.5], [0.15, 0.58], [0, 0.6]].map(([r, y]) => new THREE.Vector2(r, y));
mesh(new THREE.LatheGeometry(prof, 48), cloth(P.shirt), torso, { part: 'belly' });
const VEST_GAP = 0.42;
const vestProf = prof.slice(1, 7).map(v => new THREE.Vector2(v.x * 1.07 + 0.006, v.y));
const vestTexture = color => canvasTex(1024, 512, (x, w, h) => {
  x.fillStyle = color; x.fillRect(0, 0, w, h);
  // лёгкий бархатный перелив
  for (let i = 0; i < 4000; i++) { x.fillStyle = `rgba(255,255,255,${Math.random() * 0.05})`; x.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  x.fillStyle = '#e8b84a';
  x.fillRect(0, h - 26, w, 14); x.fillRect(0, 0, 16, h); x.fillRect(w - 16, 0, 16, h);
  x.strokeStyle = '#e8b84a'; x.lineCap = 'round';
  const swirl = (cx, cy, s, flip) => {
    x.save(); x.translate(cx, cy); x.scale(flip * s, s); x.lineWidth = 6 / s;
    x.beginPath(); x.moveTo(0, 40); x.bezierCurveTo(0, -10, 50, -20, 60, 10); x.bezierCurveTo(66, 30, 40, 40, 34, 22); x.stroke();
    x.beginPath(); x.moveTo(0, 40); x.bezierCurveTo(-6, 0, 10, -40, 40, -50); x.stroke();
    x.fillStyle = '#9fe8cf'; x.beginPath(); x.arc(40, -50, 7, 0, 7); x.fill();
    x.restore();
  };
  swirl(70, h - 120, 1.3, 1); swirl(w - 70, h - 120, 1.3, -1); swirl(70, h - 300, 0.8, 1); swirl(w - 70, h - 300, 0.8, -1);
  x.save(); x.translate(w / 2, h * 0.5); x.lineWidth = 7;
  x.beginPath(); x.arc(0, 0, 46, 0, 7); x.stroke();
  for (let k = 0; k < 4; k++) { x.rotate(Math.PI / 2); x.beginPath(); x.moveTo(0, -50); x.quadraticCurveTo(26, -90, 0, -120); x.quadraticCurveTo(-26, -90, 0, -50); x.stroke(); }
  x.restore();
});
const vestMat = std(0xffffff, { map: vestTexture(SUITS[0]), roughness: 0.7, side: THREE.DoubleSide });
mesh(new THREE.LatheGeometry(vestProf, 56, VEST_GAP, Math.PI * 2 - VEST_GAP * 2), vestMat, torso, { part: 'belly' });
[VEST_GAP, -VEST_GAP].forEach(phi => {
  const pts = vestProf.map(v => new THREE.Vector3(v.x * Math.sin(phi) * 1.01, v.y, v.x * Math.cos(phi) * 1.01));
  mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 32, 0.016, 8), goldMat(), torso, {});
});
// Вышитый ворот
const collar = [[-0.12, 0.54, 0.19], [-0.05, 0.47, 0.26], [0, 0.42, 0.29], [0.05, 0.47, 0.26], [0.12, 0.54, 0.19]].map(p => new THREE.Vector3(...p));
mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(collar), 24, 0.02, 8), suitCloth(), torso, {});
mesh(new THREE.CylinderGeometry(0.325, 0.33, 0.075, 48), suitCloth(), torso, { pos: [0, 0.12, 0] });
// Кушак с бахромой
const sash = group(torso, [-0.2, 0.11, 0.25]);
sash.rotation.y = -0.6;
mesh(new THREE.SphereGeometry(0.055, 18, 14), suitCloth(), sash, { scale: [1.2, 1, 0.8] });
[[-0.03, -0.12, 0.12], [0.04, -0.1, -0.1]].forEach(([dx, rz, ry]) => {
  const end = group(sash, [dx, -0.02, 0.01]);
  end.rotation.set(0, ry, rz);
  mesh(new THREE.BoxGeometry(0.07, 0.2, 0.018), suitCloth(), end, { pos: [0, -0.1, 0] });
  mesh(new THREE.BoxGeometry(0.072, 0.015, 0.02), goldMat(), end, { pos: [0, -0.17, 0] });
  for (let i = 0; i < 5; i++) mesh(new THREE.CylinderGeometry(0.004, 0.004, 0.05, 4), goldMat(), end, { pos: [-0.028 + i * 0.014, -0.22, 0] });
});
[0.3, 0.2].forEach(y => [VEST_GAP, -VEST_GAP].forEach(phi =>
  mesh(new THREE.SphereGeometry(0.018, 12, 10), goldMat(), torso, { pos: [0.32 * Math.sin(phi), y, 0.32 * Math.cos(phi)] })));
mesh(new THREE.CylinderGeometry(0.27, 0.27, 0.1, 32), cloth(P.pants), body, { pos: [0, 0.43, 0] });

// ---- Руки ----
function makeArm(sd) {
  const sh = group(torso, [sd * 0.28, 0.46, 0]);
  const sleeve = [[0, -0.335], [0.09, -0.33], [0.118, -0.29], [0.122, -0.2], [0.1, -0.06], [0.08, 0.05], [0, 0.06]].map(([r, y]) => new THREE.Vector2(r, y));
  mesh(new THREE.LatheGeometry(sleeve, 32), cloth(P.shirt), sh, {});
  mesh(new THREE.CylinderGeometry(0.088, 0.09, 0.06, 28), suitCloth(), sh, { pos: [0, -0.33, 0] });
  mesh(new THREE.TorusGeometry(0.09, 0.006, 6, 28), goldMat(), sh, { pos: [0, -0.31, 0], rot: [Math.PI / 2, 0, 0] });
  const paw = group(sh, [0, -0.43, 0]);
  mesh(new THREE.SphereGeometry(0.1, 28, 20), furMat(), paw, {});
  // Тёмные подушечки, как у барса
  mesh(new THREE.SphereGeometry(0.04, 16, 12), std(P.pad, { roughness: 0.55 }), paw, { pos: [0, -0.012, 0.082], scale: [1.2, 1, 0.45] });
  [-0.042, 0, 0.042].forEach(dx => mesh(new THREE.SphereGeometry(0.017, 12, 10), std(P.pad, { roughness: 0.55 }), paw, { pos: [dx, 0.048, 0.078], scale: [1, 1, 0.5] }));
  return { sh, paw };
}
const armR = makeArm(1), armL = makeArm(-1);

// ---- Книга ----
const bookTex = canvasTex(256, 340, (x, w, h) => {
  const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#22a882'); g.addColorStop(1, '#127055');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  x.strokeStyle = '#e8b84a'; x.lineWidth = 6; x.strokeRect(16, 16, w - 32, h - 32);
  x.fillStyle = '#fff'; x.textAlign = 'center'; x.font = '900 46px system-ui';
  x.fillText('ТАТАР', w / 2, 92); x.fillText('ТЕЛЕ', w / 2, 142);
  x.fillStyle = '#e8b84a';
  x.beginPath(); x.moveTo(100, 260); x.quadraticCurveTo(140, 190, 170, 170); x.quadraticCurveTo(150, 220, 110, 266); x.fill();
  x.fillStyle = '#fff'; x.font = '800 26px system-ui'; x.fillText('БАРСИК', w / 2, 306);
});
const pages = std(0xf6f1e2, { roughness: 0.9 }), cover = std(0x127055, { roughness: 0.6 });
const book = mesh(new THREE.BoxGeometry(0.3, 0.4, 0.075), [pages, cover, pages, pages, std(0xffffff, { map: bookTex, roughness: 0.55 }), cover], armL.paw, { pos: [0.08, 0.05, 0.06] });
[[-1, 1], [1, 1], [-1, -1], [1, -1]].forEach(([sx, sy]) => mesh(new THREE.BoxGeometry(0.04, 0.04, 0.08), goldMat(), book, { pos: [sx * 0.135, sy * 0.185, 0] }));

// ---- Чәкчәк в правой лапе (виден, только когда Барсик ест) ----
const treat = group(armR.paw, [0, -0.03, 0.15]);
const honey = std(0xeaa53c, { roughness: 0.28, metalness: 0.05 });
const honeyDark = std(0xc9801f, { roughness: 0.35 });
[[0, 0, 0], [0.05, 0, 0.01], [-0.05, 0, 0.01], [0.025, 0, -0.04], [-0.025, 0, -0.04], [0.025, 0.04, 0], [-0.025, 0.04, 0], [0, 0.04, -0.035], [0, 0.075, -0.01]]
  .forEach((p, i) => mesh(new THREE.SphereGeometry(0.03, 14, 10), i % 3 ? honey : honeyDark, treat, { pos: p }));
treat.visible = false;

// ---- Хвост ----

function buildTail(phase, up) {
  const s = Math.sin(phase) * 0.12, c = Math.cos(phase * 0.7) * 0.06;
  const pts = [[0, 0, 0], [0.22, -0.12, -0.18], [0.46, 0.0, -0.3], [0.56 + s * 0.4, 0.32 + up * 0.15, -0.26], [0.48 + s, 0.62 + up * 0.25, -0.12 + c]]
    .map(p => new THREE.Vector3(...p));
  const curve = new THREE.CatmullRomCurve3(pts), SEG = 48, RAD = 16;
  // Хвост у снежного барса очень толстый и пушистый — почти как его тело
  const geo = new THREE.TubeGeometry(curve, SEG, 0.085, RAD);
  const pos = geo.attributes.position, cp = new THREE.Vector3(), v = new THREE.Vector3();
  for (let i = 0; i <= SEG; i++) {
    const u = i / SEG, f = 0.8 + 0.55 * Math.pow(u, 0.8);
    curve.getPointAt(u, cp);
    for (let j = 0; j <= RAD; j++) {
      const k = i * (RAD + 1) + j;
      v.fromBufferAttribute(pos, k).sub(cp).multiplyScalar(f).add(cp);
      pos.setXYZ(k, v.x, v.y, v.z);
    }
  }
  geo.computeVertexNormals();
  if (tailMesh) { tailMesh.geometry.dispose(); tailMesh.geometry = geo; }
  else tailMesh = mesh(geo, tailMat, tailRoot, { part: 'belly' });
  tailTip.position.copy(pts[pts.length - 1]);
}

}

function rosette(dir, r) {
  const at = onHead(dir, 0.002);
  const g = group(head, at.p.toArray());
  alignZ(g, at.n);
  g.rotateZ(rnd() * 6.28);

  const mid = mesh(blobGeo, rosetteMidMat, g, { pos: [0, 0, -0.0005], shadow: false });

  const n = 3 + (rnd() > 0.5 ? 1 : 0);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 1.75 + rnd() * 0.3;
    const b = mesh(blobGeo, spotMat, g, { pos: [Math.cos(a) * r * 0.78, Math.sin(a) * r * 0.78, 0], shadow: false });
    b.scale.set(r * (0.42 + rnd() * 0.18), r * (0.24 + rnd() * 0.1), 1);

}

function capTexture(color) {
  return canvasTex(1024, 256, (x, w, h) => {
    x.fillStyle = color; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 6000; i++) { x.fillStyle = `rgba(255,255,255,${Math.random() * 0.05})`; x.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
    x.fillStyle = '#ffffff'; x.fillRect(0, 0, w, 14);
    x.strokeStyle = '#e8b84a';
    x.lineWidth = 10; x.beginPath(); x.moveTo(0, h - 22); x.lineTo(w, h - 22); x.stroke();
    x.lineWidth = 4; x.beginPath(); x.moveTo(0, 34); x.lineTo(w, 34); x.stroke();
    const petal = new Path2D('M0,-6 C-12,-18 -8,-34 0,-38 C8,-34 12,-18 0,-6Z');
    for (let i = 0; i <= 6; i++) {
      x.save(); x.translate(i * w / 6, h * 0.53);
      for (let k = 0; k < 6; k++) { x.save(); x.rotate(k * Math.PI / 3); x.fillStyle = '#9fe8cf'; x.fill(petal); x.lineWidth = 3; x.strokeStyle = '#e8b84a'; x.stroke(petal); x.restore(); }
      x.fillStyle = '#e8b84a'; x.beginPath(); x.arc(0, 0, 8, 0, 7); x.fill();
      x.lineWidth = 5; x.strokeStyle = '#e8b84a'; x.lineCap = 'round';
      [-1, 1].forEach(sd => { x.beginPath(); x.moveTo(sd * 46, 8); x.quadraticCurveTo(sd * 66, -26, sd * 92, -8); x.quadraticCurveTo(sd * 100, 10, sd * 80, 18); x.stroke(); });
      x.restore();
    }
  });
}
// Купол тюбетейки: 8 клиньев (как шьют настоящую), по швам золотая строчка, в каждом клине — тюльпан.
// Текстура «обёрнута» вокруг полусферы: верх картинки — макушка, низ — край купола.
const CAP_GORES = 8;
const capTopTexture = color => canvasTex(1024, 256, (x, w, h) => {
  x.fillStyle = color; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 3000; i++) { x.fillStyle = `rgba(255,255,255,${Math.random() * 0.05})`; x.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  const gw = w / CAP_GORES;
  x.strokeStyle = '#e8b84a'; x.lineCap = 'round';
  for (let i = 0; i < CAP_GORES; i++) {
    const cx = i * gw;
    // Шов: двойная строчка
    x.lineWidth = 5; x.beginPath(); x.moveTo(cx, 0); x.lineTo(cx, h); x.stroke();
    x.lineWidth = 2; x.setLineDash([6, 6]);

    const tx = cx + gw / 2, ty = h * 0.62;
    x.fillStyle = '#9fe8cf'; x.lineWidth = 3;
    const petal = (dx, rot, s) => { x.save(); x.translate(tx + dx, ty); x.rotate(rot); x.scale(s, s);
      x.beginPath(); x.moveTo(0, 18); x.bezierCurveTo(-16, 0, -10, -26, 0, -34); x.bezierCurveTo(10, -26, 16, 0, 0, 18); x.fill(); x.stroke(); x.restore(); };
    petal(-12, -0.45, 0.75); petal(12, 0.45, 0.75); petal(0, 0, 1);
    x.lineWidth = 4; x.beginPath(); x.moveTo(tx, ty + 18); x.lineTo(tx, h - 26); x.stroke();
    x.fillStyle = '#e8b84a'; x.beginPath(); x.arc(tx, h * 0.25, 7, 0, 7); x.fill();
  }
  // Нижний край купола — золотая полоса
  x.fillStyle = '#e8b84a'; x.fillRect(0, h - 14, w, 14);
});

function spawnCrumbs(n) {
  let made = 0;
  crumbs.forEach(c => {
    if (made >= n || c.life > 0) return;
    c.life = 1;
    c.m.position.set(mouth.position.x + (Math.random() - 0.5) * 0.12, mouth.position.y, mouth.position.z + 0.05);
    c.v.set((Math.random() - 0.5) * 0.7, 0.35 + Math.random() * 0.5, 0.25 + Math.random() * 0.35);
    c.m.visible = true;
    made++;
  });
}
function updateCrumbs(dt) {
  crumbs.forEach(c => {
    if (c.life <= 0) return;
    c.life -= dt * 1.1;
    c.v.y -= 2.6 * dt;
    c.m.position.addScaledVector(c.v, dt);
    if (c.life <= 0) c.m.visible = false;
  });
}

function applyFace(f, blink) {
  const open = blink ? 0.02 : f.open;
  eyes.forEach(e => {

    e.lower.rotation.x = THREE.MathUtils.lerp(1.3, -0.05, f.smileLids);
    const size = f.pupil < 0.8 ? 0 : (f.pupil > 1.08 ? 2 : 1);
    e.pupils.forEach((p, i) => { p.visible = i === size; });
    e.brow.position.y = 0.2 + f.browY;
    e.brow.rotation.z = e.sd * f.browTilt;
  });
  const m = f.mouth;
  mouthHole.visible = m > 0.05;
  // Улыбка — рот шире и ниже, удивление — круглый «О»
  mouthHole.scale.set(1.0 + Math.max(0, f.smile - 0.8) * 0.9, 0.25 + m * 0.75, 0.35);
  tongue.visible = m > 0.3;
  smile.visible = m <= 0.05;
  smile.scale.y = f.smile;
}
const EXPR = {
  neutral:   { open: 1.0,  smileLids: 0,    pupil: 1,    browY: 0,     browTilt: 0,    smile: 1 },
  happy:     { open: 0.9,  smileLids: 0.55, pupil: 1,    browY: 0.015, browTilt: 0,    smile: 1.4 },
  listen:    { open: 1,    smileLids: 0,    pupil: 1.15, browY: 0.02,  browTilt: -0.15, smile: 0.8 },
  surprised: { open: 1.12, smileLids: 0,    pupil: 0.65, browY: 0.04,  browTilt: 0,    smile: 0 },
  sad:       { open: 0.72, smileLids: 0,    pupil: 1.1,  browY: 0.01,  browTilt: -0.5, smile: -1 },
  sleepy:    { open: 0.12, smileLids: 0.25, pupil: 1,    browY: 0.03,  browTilt: 0,    smile: 0 },
  yum:       { open: 0.3,  smileLids: 0.8,  pupil: 1,    browY: 0.02,  browTilt: 0,    smile: 1.5 },
  wow:       { open: 1.12, smileLids: 0,    pupil: 1.15, browY: 0.045, browTilt: 0,    smile: 1.2 },
};

// ================= Анимации =================
const ACTIONS = { wave: 1800, talk: 2200, dance: 2600, eat: 4400, surprise: 1100, pet: 1400, tickle: 1300, listen: 0, sad: 0, happy: 1500 };
// Еда: сколько кусочков уже откушено и какого размера чәкчәк в лапе
let bites = 0, treatSize = 0;
// «Жизнь» в покое: время от времени Барсик зевает, читает книгу, чешет ушко…
const IDLE_ACTS = { yawn: 2.6, read: 3.2, scratch: 1.9, tilt: 1.7, wiggle: 1.6, sniff: 1.6 };
let idleAct = null, idleStart = 0, nextIdle = 5, lastIdle = null;
let action = 'idle', actionStart = 0, actionMs = 0, listenLevel = 0, restPose = 'idle';
let dragY = 0, dragX = 0, dragging = false;
const clock = new THREE.Clock();
const lerp = (a, b, k) => a + (b - a) * k;
const cur = { rZ: 0.3, rX: 0, lZ: -0.2, lX: -0.95, hX: 0, hY: 0, hZ: 0, ear: 0, tailUp: 0 };
const curFace = Object.assign({ mouth: 0 }, EXPR.neutral);

function play(name, ms) {
  action = name;
  actionStart = clock.elapsedTime;
  actionMs = ms != null && ms > 0 ? ms : (ACTIONS[name] || 0);
  if (name === 'idle') action = restPose;
  if (name === 'eat') { bites = 0; treatSize = 0; }
  idleAct = null;
  if (!native) ({ pet: '❤️', tickle: '✨', eat: '🍯', dance: '🎵', happy: '⭐' })[name] && burst(({ pet: '❤️', tickle: '✨', eat: '🍯', dance: '🎵', happy: '⭐' })[name]);
}

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  let t = actionMs > 0 ? (time - actionStart) * 1000 / actionMs : 0;
  if (actionMs > 0 && t >= 1) { action = restPose; actionMs = 0; t = 0; }
  const is = n => action === n;
  const k = 1 - Math.exp(-dt * 10);

  const tgt = { rZ: 0.3, rX: 0, lZ: -0.2, lX: -0.95, hX: 0, hY: 0, hZ: 0, ear: 0, tailUp: 0 };
  let expr = 'neutral', mouth = 0, jump = 0, sway = 0, bookOn = true;
  const lookPh = time % 9;
  if (is('idle')) tgt.hY = lookPh > 2.5 && lookPh < 3.8 ? 0.35 : (lookPh > 4.2 && lookPh < 5.2 ? -0.35 : 0);
  if (is('wave')) { tgt.rZ = 2.25 + Math.sin(t * Math.PI * 9) * 0.3; tgt.rX = -0.45; tgt.hZ = -0.12; expr = 'happy'; mouth = 0.6; }
  if (is('listen')) { tgt.hZ = 0.22; tgt.ear = 1; expr = 'listen'; tgt.tailUp = 0.6; }
  if (is('talk')) { tgt.hX = Math.sin(t * Math.PI * 6) * 0.06; mouth = Math.abs(Math.sin(t * Math.PI * 9)) * (0.6 + 0.4 * Math.sin(t * 17)); }
  if (is('dance')) {
    const b = Math.sin(t * Math.PI * 8);
    tgt.rZ = 2.4 + b * 0.4; tgt.lZ = -2.4 + b * 0.4; tgt.lX = 0; tgt.hZ = b * 0.18;
    jump = Math.abs(b) * 0.06; sway = b * 0.12; expr = 'happy'; mouth = 0.7; bookOn = false; tgt.tailUp = 1;
  }
  let puff = 0, lick = 0, treatTarget = 0, noseWiggle = 0;
  const seg = (a, b, x = t) => Math.max(0, Math.min(1, (x - a) / (b - a)));
  if (is('eat')) {
    if (t < 0.13) {
      // Увидел чәкчәк в лапе: глаза круглые, ушки торчком, принюхивается
      treatTarget = 1; expr = 'wow'; tgt.ear = 1; mouth = 0.3;
      tgt.rX = -1.15; tgt.rZ = 0.1; tgt.hX = 0.24; tgt.hZ = 0.08;
      noseWiggle = Math.sin(t * Math.PI * 60);
    } else if (t < 0.73) {
      // Три укуса: поднёс ко рту — «ам!» — жуёт с надутыми щёчками, крошки летят
      const b = (t - 0.13) / 0.2, i = Math.min(2, Math.floor(b)), u = b - i;
      tgt.tailUp = 1;
      if (u < 0.28) {
        tgt.rX = -1.48; tgt.rZ = -0.55; tgt.hX = 0.3; mouth = 1; expr = 'happy';
        treatTarget = 1 - i / 3;
      } else {
        if (bites <= i) { bites = i + 1; spawnCrumbs(5); }
        treatTarget = 1 - bites / 3;
        tgt.rX = -1.15; tgt.rZ = -0.35; expr = 'yum';
        const chew = Math.sin(u * Math.PI * 11);
        mouth = 0.08 + Math.max(0, chew) * 0.3;
        puff = 0.55 + chew * 0.45;
        tgt.hX = chew * 0.05; tgt.hZ = Math.sin(u * Math.PI * 2) * 0.12; sway = Math.sin(u * Math.PI * 4) * 0.03;
      }
    } else if (t < 0.87) {
      // Облизывается
      expr = 'happy'; mouth = 0.42; lick = Math.sin(seg(0.73, 0.87) * Math.PI * 3);
      tgt.rX = -0.5; tgt.rZ = 0.25; tgt.hZ = lick * 0.06;
    } else {
      // Доволен: гладит животик и подпрыгивает
      const p = seg(0.87, 1);
      expr = 'happy'; mouth = 0.6; jump = Math.sin(p * Math.PI) * 0.09; tgt.tailUp = 1; tgt.hZ = 0.14;
      tgt.rX = -0.8; tgt.rZ = -0.55 + Math.sin(p * Math.PI * 6) * 0.14;
    }
  }
  // Покой: случайные «живые» движения
  if (is('idle') && !dragging) {
    if (!idleAct && time > nextIdle) {
      const names = Object.keys(IDLE_ACTS).filter(n => n !== lastIdle);
      idleAct = lastIdle = names[Math.floor(Math.random() * names.length)];
      idleStart = time;
    }
    if (idleAct) {
      const it = (time - idleStart) / IDLE_ACTS[idleAct], e = Math.sin(Math.min(1, it) * Math.PI);
      if (it >= 1) { idleAct = null; nextIdle = time + 3.5 + Math.random() * 5; }
      else if (idleAct === 'yawn') { expr = 'sleepy'; mouth = e; tgt.hX = -0.2 * e; tgt.rZ = 0.3 + 1.9 * e; tgt.rX = -0.3 * e; tgt.ear = -0.4 * e; tgt.hY = 0; }
      else if (idleAct === 'read') { tgt.hY = -0.42 * e; tgt.hX = 0.26 * e + Math.sin(it * Math.PI * 6) * 0.02; tgt.lX = -0.95 - 0.35 * e; expr = e > 0.5 ? 'listen' : 'neutral'; }
      else if (idleAct === 'scratch') { tgt.rZ = 2.55 + Math.sin(it * Math.PI * 14) * 0.16; tgt.rX = -0.25; tgt.hZ = -0.2 * e; tgt.hY = 0; expr = 'yum'; tgt.tailUp = 0.6; }
      else if (idleAct === 'tilt') { tgt.hZ = 0.3 * e; tgt.ear = e; expr = 'listen'; tgt.hY = 0; }
      else if (idleAct === 'wiggle') { sway = Math.sin(it * Math.PI * 6) * 0.07 * (1 - it); tgt.tailUp = 1; expr = 'happy'; tgt.hY = 0; }
      else if (idleAct === 'sniff') { tgt.hX = -0.12 * e; tgt.ear = e; noseWiggle = Math.sin(it * Math.PI * 16); tgt.hY = 0.2 * Math.sin(it * Math.PI * 2); }
    }
  } else idleAct = null;
  if (is('surprise')) { expr = 'surprised'; mouth = 0.5; jump = Math.sin(t * Math.PI) * 0.28; tgt.ear = 1; tgt.rZ = 0.9; tgt.lZ = -0.9; tgt.lX = -0.4; }
  if (is('pet') || is('happy')) { expr = 'happy'; mouth = is('happy') ? 0.6 : 0; jump = Math.sin(t * Math.PI) * 0.1; tgt.hZ = 0.12; tgt.tailUp = 1; }
  if (is('tickle')) { expr = 'happy'; mouth = 0.9; sway = Math.sin(t * Math.PI * 12) * 0.14 * (1 - t); }
  if (is('sad')) { expr = 'sad'; tgt.ear = -1; tgt.hX = 0.18; tgt.rZ = 0.15; }

  for (const key in cur) cur[key] = lerp(cur[key], tgt[key], k);
  const ef = EXPR[expr];
  const fk = 1 - Math.exp(-dt * 14);
  for (const key in ef) curFace[key] = lerp(curFace[key], ef[key], fk);
  curFace.mouth = lerp(curFace.mouth, mouth, 1 - Math.exp(-dt * 22));

  const breath = (Math.sin(time * 3.4) + 1) / 2;
  torso.scale.set(1 - breath * 0.008, 1 + breath * 0.018, 1);
  armR.sh.rotation.set(cur.rX, 0, cur.rZ);
  armL.sh.rotation.set(cur.lX, 0, cur.lZ);
  book.visible = bookOn;
  book.rotation.x = -cur.lX - 0.1;
  head.rotation.set(cur.hX - dragX * 0.3, cur.hY, cur.hZ);
  ears.forEach((e, i) => {
    const sd = i === 0 ? -1 : 1;
    const twitch = (time + i * 2.3) % 5.2 > 4.9 ? Math.sin(time * 60) * 0.15 : 0;
    const quiver = is('listen') ? Math.sin(time * 40 + i) * 0.06 * listenLevel : 0;
    e.rotation.z = -sd * (0.42 - cur.ear * 0.18) + twitch + quiver;
    e.rotation.x = cur.ear < 0 ? -cur.ear * 0.5 : 0;
    const s = 1 + Math.max(0, cur.ear) * 0.15;
    e.scale.set(s, s, s);
  });
  // Глаза следят за поворотом головы
  eyes.forEach(e => { e.ball.rotation.y = cur.hY * 0.35; });
  ringMats.forEach((m, i) => m.opacity = is('listen') ? Math.max(0, Math.min(1, (0.35 + listenLevel) * 1.4 - i * 0.3)) * (0.6 + 0.4 * Math.sin(time * 8 - i)) : 0);
  body.position.y = jump;
  body.scale.set(1 - jump * 0.4, 1 + jump * 0.8, 1 - jump * 0.4);
  body.rotation.z = sway;
  buildTail(time * (is('dance') || expr === 'happy' ? 5 : 2.4), cur.tailUp);
  const blink = expr !== 'happy' && expr !== 'surprised' && time % 3.9 > 3.76;
  applyFace(curFace, blink);
  // Чәкчәк в лапе, щёчки, язык и нос
  treatSize = lerp(treatSize, treatTarget, 1 - Math.exp(-dt * 16));
  treat.visible = treatSize > 0.03;
  treat.scale.setScalar(Math.max(0.001, treatSize));
  muzzle.forEach(m => m.scale.set(1 + puff * 0.24, 0.85 + puff * 0.14, 0.8 + puff * 0.16));
  if (lick !== 0) { tongue.visible = true; tongue.position.set(lick * 0.55, -0.15, 0.75); tongue.scale.set(1.3, 0.7, 1.7); }
  else { tongue.position.set(0, -0.4, 0.4); tongue.scale.set(1, 0.6, 1); }
  nose.position.y = noseAt.p.y + noseWiggle * 0.008;
  nose.scale.set(1.25 + noseWiggle * 0.06, 0.8, 0.8);
  updateCrumbs(dt);
  if (!dragging) { dragY = lerp(dragY, 0, 1 - Math.exp(-dt * 4)); dragX = lerp(dragX, 0, 1 - Math.exp(-dt * 4)); }
  root.rotation.y = dragY + Math.sin(time * 0.6) * 0.08;

  const size = renderer.getSize(new THREE.Vector2());
  if (size.x !== stage.clientWidth || size.y !== stage.clientHeight) resize();
  if (stage.clientHeight > 20) renderer.render(scene, camera);
  if (!readySent && stage.clientHeight > 20) { readySent = true; native && native.onReady(); }
  if (!drawnSent && readySent && ++checks % 10 === 0) checkDrawn();
}
let readySent = false, drawnSent = false, checks = 0;
function checkDrawn() {
  const gl = renderer.getContext(), w = gl.drawingBufferWidth, h = gl.drawingBufferHeight, px = new Uint8Array(4);
  let hits = 0;
  for (let i = 1; i < 20; i++) {
    gl.readPixels(Math.floor(w / 2), Math.floor(h * i / 20), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    if (px[3] > 0) hits++;
  }
  if (hits >= 3) {
    drawnSent = true;
    // Плавное появление: Барсик проявляется, слегка «подпрыгивает» и машет лапкой
    renderer.domElement.classList.add('shown');
    play('wave', 1600);
    native && native.onDrawn();
  }
}
function loop() {
  try { frame(); } catch (e) { native && native.onLog(String(e)); console.error(e); }
  requestAnimationFrame(loop);
}

// ================= Касания =================
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downX = 0, downY = 0, moved = false;
stage.addEventListener('pointerdown', e => { dragging = true; moved = false; downX = e.clientX; downY = e.clientY; stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e => {
  if (!dragging) return;
  if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 6) moved = true;
  if (moved) { dragY = Math.max(-2.6, Math.min(2.6, dragY + e.movementX * 0.012)); dragX = Math.max(-0.4, Math.min(0.4, dragX + e.movementY * 0.004)); }
});
stage.addEventListener('pointerup', e => {
  dragging = false;
  if (moved) return;
  const r = stage.getBoundingClientRect();
  ptr.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(root.children, true).find(h => h.object.userData.part);
  if (!hit) return;
  const part = hit.object.userData.part === 'head' ? 'head' : 'belly';
  if (native) native.onTap(part); else play(part === 'head' ? 'pet' : 'tickle');
});
function burst(emoji) {
  const r = stage.getBoundingClientRect();
  for (let i = 0; i < 6; i++) {
    const d = document.createElement('div');
    d.className = 'fx'; d.textContent = emoji;
    d.style.left = (r.width * (0.35 + Math.random() * 0.3)) + 'px';
    d.style.top = (r.height * 0.3) + 'px';
    d.style.animationDelay = (i * 0.09) + 's';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 1700);
  }
}

// ================= API для приложения =================
window.Barsik = {
  play,
  setListenLevel: v => { listenLevel = v; },
  setVoiceLevel: () => {},
  setCap: i => {
    const k = i % CAPS.length;
    capColor = CAPS[k];
    // Старые текстуры освобождаем — тюбетейку можно менять сколько угодно раз
    [capSide, capTop, vestMat].forEach(m => m.map && m.map.dispose());
    capSide.map = capTexture(capColor); capSide.needsUpdate = true;
    capTop.map = capTopTexture(capColor); capTop.needsUpdate = true;
    // Весь костюм — под цвет тюбетейки
    vestMat.map = vestTexture(SUITS[k]); vestMat.needsUpdate = true;
    suitMats.forEach(m => m.color.copy(lin(SUITS[k])));
  },
  setSad: sad => {
    restPose = sad ? 'sad' : 'idle';
    if (action === 'idle' || action === 'sad') action = restPose;
  },
};

// ================= Кнопки (только в превью, в приложении их нет) =================
if (!native) {
  const bar = document.createElement('div');
  bar.className = 'bar';
  let capIdx = 0, timer = null;
  [
    ['👋 Привет', () => play('wave')],
    ['👂 Слушает', () => { play('listen'); clearInterval(timer); const s = Date.now(); timer = setInterval(() => { listenLevel = Math.random() * 0.8; if (Date.now() - s > 2500) { clearInterval(timer); listenLevel = 0; play('talk'); } }, 90); }],
    ['💬 Говорит', () => play('talk')],
    ['💃 Танцует', () => play('dance')],
    ['🍯 Ест', () => play('eat')],
    ['😲 Удивлён', () => play('surprise')],
    ['😊 Радуется', () => play('happy')],
    ['😢 Грустит', () => window.Barsik.setSad(restPose !== 'sad')],
    ['🎩 Тюбетейка', () => window.Barsik.setCap(++capIdx)],
  ].forEach(([label, fn]) => { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; bar.appendChild(b); });
  document.body.appendChild(bar);
}

resize();
buildTail(0, 0);
loop();
})();
</script>
